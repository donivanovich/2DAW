<section>

  <h1>Biblioteca</h1>

  <h2>Listado de libros</h2>

  <nav>
    <a routerLink="/libros">Todos</a>

    <a [routerLink]="['/libros']"
      [queryParams]="{genero: 'novela'}">
      Novela
    </a>

    <a [routerLink]="['/libros']"
      [queryParams]="{genero: 'fantasia'}">
      Fantasía
    </a>

    <a [routerLink]="['/libros']"
      [queryParams]="{genero: 'epica'}">
      Épica
    </a>
  </nav>

  <ul>
    @for (libro of libros(); track libro.id) {
      <li>
        <a [routerLink]="['/libros', libro.id]">
          {{ libro.titulo }}
        </a>
      </li>
    } @empty {
      <p>No hay libros disponibles.</p>
    }
  </ul>

</section>
