<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="topDome" x1="16" y1="6" x2="48" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4B2B" />
      <stop offset="100%" stop-color="#D92608" />
    </linearGradient>
    <linearGradient id="bottomDome" x1="32" y1="32" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <clipPath id="ballClip">
      <circle cx="32" cy="32" r="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#ballClip)">
    <!-- Hemisferio inferior -->
    <rect x="0" y="32" width="64" height="32" fill="url(#bottomDome)" />

    <!-- Hemisferio superior -->
    <rect x="0" y="0" width="64" height="32" fill="url(#topDome)" />

    <!-- Brillo minimalista superior -->
    <path
      d="M15 17C18.2 12.2 23.8 9.2 30 9"
      stroke="#FFFFFF"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-opacity="0.55"
    />

    <!-- Franja central -->
    <rect x="0" y="28.5" width="64" height="7" fill="#0F172A" />
  </g>

  <!-- Contorno exterior definido (visible en pestañas claras y oscuras) -->
  <circle cx="32" cy="32" r="28" stroke="#0F172A" stroke-width="5" />

  <!-- Botón central -->
  <circle cx="32" cy="32" r="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" />
  <circle cx="32" cy="32" r="4.5" fill="#0F172A" fill-opacity="0.18" />
</svg>
